function clone(x){return JSON.parse(JSON.stringify(x))}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])a[k]=merge(a[k],b[k]);else a[k]=b[k]}return a}
function makeBebewDefaults(){
 const b=clone(alphaDefaults);

 try{

 const alpha=legacy?merge(clone(alphaDefaults),legacy):clone(alphaDefaults);alpha.profile.app='Cats';alpha.profile.defaultAccent=alpha.profile.defaultAccent||'#2563eb';

function chart(canvas,data,colorKey='value',yLabel='Valeur'){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!data.length)return;const vals=data.map(x=>x[colorKey]),min0=Math.min(...vals),max0=Math.max(...vals),extra=(max0-min0||1)*.12,min=min0-extra,max=max0+extra,padL=54,padR=18,padT=18,padB=48,span=(max-min)||1;const css=getComputedStyle(document.documentElement),muted=css.getPropertyValue('--muted').trim(),line=css.getPropertyValue('--line').trim();ctx.font='11px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillStyle=muted;ctx.strokeStyle=line;ctx.lineWidth=1;for(let i=0;i<4;i++){const y=padT+(h-padT-padB)*i/3,val=max-(max-min)*i/3;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText((yLabel.includes('kg')?val.toFixed(2):val.toFixed(0)),padL-7,y)}ctx.save();ctx.translate(14,h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.font='bold 11px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(yLabel,0,0);ctx.restore();ctx.textAlign='center';ctx.fillText('Date',padL+(w-padL-padR)/2,h-8);const pts=[];ctx.strokeStyle=state.settings.accent;ctx.fillStyle=state.settings.accent;ctx.lineWidth=3;ctx.beginPath();data.forEach((x,i)=>{const xx=padL+(w-padL-padR)*(data.length===1?.5:i/(data.length-1)),yy=h-padB-(x[colorKey]-min)/span*(h-padT-padB);pts.push({x:xx,y:yy,item:x});i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill()});if(data.length){const indexes=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);ctx.fillStyle=muted;ctx.font='10px -apple-system,BlinkMacSystemFont,sans-serif';indexes.forEach(i=>{ctx.textAlign=i===0?'left':(i===data.length-1?'right':'center');ctx.fillText(fmtDate(data[i].date).slice(0,5),pts[i].x,h-padB+18)})}canvas._chartPoints=pts;const hit=e=>{const r=canvas.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;let best=null,dist=1e9;pts.forEach(p=>{const d=Math.hypot(p.x-cx,p.y-cy);if(d<dist){dist=d;best=p}});if(best&&dist<30){const it=best.item,val=it[colorKey];modal(`<div class="modalhead"><h2>Mesure</h2><button class="close" data-close>×</button></div><div class="charttip">${fmtDate(it.date)}</div><div class="kcalbig" style="font-size:36px;margin:12px 0">${yLabel.includes('kg')?Number(val).toFixed(2)+' kg':(it.min!==undefined?(it.min===it.max?it.min:it.min+'–'+it.max)+'/min':val)}</div>${it.context?`<div class="note" style="text-align:center">${esc(it.context)}${it.note?' · '+esc(it.note):''}</div>`:''}`)}};canvas.onclick=hit;canvas.ontouchend=e=>{const t=e.changedTouches[0];hit({clientX:t.clientX,clientY:t.clientY})}}
async function openPdf(src){document.getElementById('modalRoot').innerHTML=`<div class="pdfviewer"><div class="pdfstatus" id="pdfStatus">Chargement…</div><button class="pdfclose" id="pdfClose" aria-label="Fermer">×</button><div class="pdfpages" id="pdfPages"></div></div>`;document.getElementById('pdfClose').onclick=closeModal;const box=document.getElementById('pdfPages'),status=document.getElementById('pdfStatus');try{if(!window.pdfjsLib)throw new Error('PDF.js indisponible');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument(src).promise;status.textContent=`${pdf.numPages} page${pdf.numPages>1?'s':''}`;for(let n=1;n<=pdf.numPages;n++){if(!document.getElementById('pdfPages'))return;const page=await pdf.getPage(n),base=page.getViewport({scale:1}),scale=Math.min(2.2,(window.innerWidth-16)/base.width*(devicePixelRatio||1)),vp=page.getViewport({scale}),cv=document.createElement('canvas');cv.className='pdfpage';cv.width=vp.width;cv.height=vp.height;cv.style.width=Math.min(window.innerWidth-16,base.width)+'px';box.appendChild(cv);await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}}catch(e){status.textContent='Ouverture native';box.innerHTML=`<div style="padding:90px 18px;color:white;text-align:center"><p>La visionneuse intégrée n’a pas pu charger ce PDF.</p><a class="btn primary" style="display:inline-block;text-decoration:none" href="${esc(src)}" target="_blank">Ouvrir le PDF complet</a></div>`}}

function portionOptions(value){const opts=[[0,'0'],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾'],[1,'1'],[1.5,'1½'],[2,'2'],[2.5,'2½'],[3,'3']];return opts.map(([v,l])=>`<option value="${v}" ${Math.abs((+value||0)-v)<0.001?'selected':''}>${l} portion${v>1?'s':''}</option>`).join('')}
function foodQtyControl(f){const q=todayFood[f.id]||0;if(f.mode==='portion')return `<select class="portionselect" data-food="${f.id}">${portionOptions(q)}</select>`;return `<input data-food="${f.id}" type="number" min="0" step="1" inputmode="decimal" value="${q}">`}
function renderKcal(){enrichFoods();const el=document.getElementById('view-kcal');const low=+(state.energyTargets?.low||0),maint=+(state.energyTargets?.maint||0);if(!kcalTarget)kcalTarget=low||maint||0;state.foods.forEach(f=>{if(todayFood[f.id]===undefined)todayFood[f.id]=0});if(currentCatId()==='alpha'&&Object.keys(todayFood).every(k=>!todayFood[k])){if(state.foods.find(f=>f.id==='f1'))todayFood.f1=25;if(state.foods.find(f=>f.id==='f2'))todayFood.f2=1;if(state.foods.find(f=>f.id==='f4'))todayFood.f4=1}const total=calcKcal(),left=kcalTarget? kcalTarget-total:0,avg=kcalAverage(kcalAvgRange);const targetHtml=(low&&maint)?`<div class="targetswitch"><button class="btn ${kcalTarget===low?'active':''}" data-target="${low}"><span>Sèche</span><br><strong>${low} kcal</strong></button><button class="btn ${kcalTarget===maint?'active':''}" data-target="${maint}"><span>Maintien</span><br><strong>${maint} kcal</strong></button></div>`:`<div class="note" style="text-align:center;margin-bottom:12px">Les besoins énergétiques de ${esc(state.profile.nickname)} ne sont pas encore renseignés.</div><button class="btn primary full" id="setTargets">Configurer les objectifs kcal</button>`;el.innerHTML=`<div class="card"><div class="cardpad">${targetHtml}<div class="kcalbig">${Math.round(total)} <span style="font-size:18px">kcal</span></div>${kcalTarget?`<div class="progress"><div style="width:${Math.min(100,total/kcalTarget*100)}%"></div></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Objectif ${kcalTarget}</span><strong>${left>=0?Math.round(left)+' kcal restantes':Math.abs(Math.round(left))+' kcal au-dessus'}</strong></div>`:''}</div></div><div class="card"><div class="cardpad"><h2>Repas du jour</h2>${state.foods.map(f=>`<div class="foodrow"><div class="foodmain"><button class="foodnamebtn" data-foodinfo="${f.id}">${esc(f.name)}</button><div class="foodmeta">${esc(foodEnergyLabel(f))}${f.usualPortion?' · habituel : '+esc(f.usualPortion):''}</div></div>${foodQtyControl(f)}<div style="text-align:right;font-weight:800">${Math.round((todayFood[f.id]||0)*f.kcal)}</div></div>`).join('')}<div class="seg" style="margin-top:12px"><button class="btn" id="addFood">+ Aliment</button><button class="btn primary" id="saveDay">Enregistrer le jour</button></div></div></div>${currentCatId()==='alpha'?`<div class="card"><div class="cardpad"><h2>Repère habituel</h2><div class="note">25 g de croquettes + 1 Félix Soupe + 1 sachet Félix effilés = <strong>169 kcal</strong>.</div></div></div>`:''}<div class="card"><div class="cardpad"><h2>Historique calories</h2>${state.kcalHistory.length?state.kcalHistory.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="listitem"><div class="grow"><strong>${fmtDate(x.date)} · ${Math.round(x.total)} kcal</strong><div class="muted">${x.target?'Objectif '+x.target+' kcal':'Sans objectif'}</div></div><button class="btn danger" data-kdel="${x.id}">×</button></div>`).join(''):'<div class="muted">Aucune journée enregistrée.</div>'}</div></div><div class="card"><div class="cardpad"><h2>Calories moyennes</h2><div class="avgseg"><button class="btn ${kcalAvgRange==='week'?'active':''}" data-avgrange="week">Semaine</button><button class="btn ${kcalAvgRange==='month'?'active':''}" data-avgrange="month">Mois</button><button class="btn ${kcalAvgRange==='all'?'active':''}" data-avgrange="all">Début</button></div><div class="kcalbig" style="font-size:36px;margin-top:14px">${avg.count?Math.round(avg.avg)+' kcal':'—'}</div><div class="note" style="text-align:center">${avg.count?`Moyenne calculée sur ${avg.count} jour${avg.count>1?'s':''} enregistré${avg.count>1?'s':''}.`:'Aucune journée enregistrée sur cette période.'}</div></div></div>`;el.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{kcalTarget=+b.dataset.target;renderKcal()});el.querySelectorAll('[data-avgrange]').forEach(b=>b.onclick=()=>{kcalAvgRange=b.dataset.avgrange;renderKcal()});el.querySelectorAll('[data-food]').forEach(inp=>{const update=()=>{todayFood[inp.dataset.food]=+inp.value||0;renderKcal()};inp.onchange=update});el.querySelectorAll('[data-foodinfo]').forEach(b=>b.onclick=()=>foodDetail(b.dataset.foodinfo));el.querySelector('#addFood').onclick=foodModal;el.querySelector('#setTargets')?.addEventListener('click',energyTargetModal);el.querySelector('#saveDay').onclick=()=>{const d=isoToday(),entry={id:crypto.randomUUID(),date:d,target:kcalTarget||0,total:calcKcal(),items:clone(todayFood)};state.kcalHistory=state.kcalHistory.filter(x=>x.date!==d);state.kcalHistory.push(entry);save();alert('Journée enregistrée.');renderKcal()};el.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette journée ?')){state.kcalHistory=state.kcalHistory.filter(x=>x.id!==b.dataset.kdel);save();renderKcal()}})}
function energyTargetModal(){const t=state.energyTargets||{low:0,maint:0};modal(`<div class="modalhead"><h2>Objectifs calories — ${esc(state.profile.nickname)}</h2><button class="close" data-close>×</button></div><div class="seg"><div class="field"><label>Sèche (kcal)</label><input id="elow" type="number" inputmode="numeric" value="${t.low||''}"></div><div class="field"><label>Maintien (kcal)</label><input id="emaint" type="number" inputmode="numeric" value="${t.maint||''}"></div></div><button class="btn primary full" id="saveEnergy">Enregistrer</button>`);saveEnergy.onclick=()=>{state.energyTargets={low:+elow.value||0,maint:+emaint.value||0};kcalTarget=state.energyTargets.low||state.energyTargets.maint||0;save();closeModal();renderKcal()}}

function calcKcal(){return state.foods.reduce((s,f)=>s+(todayFood[f.id]||0)*f.kcal,0)}
function nutrient(label,value,unit='%'){if(value===null||value===undefined||value==='')return'';return `<div class="nutri"><div class="k">${label}</div><div class="v">${esc(String(value))}${unit}</div></div>`}
function foodDetail(id){const f=state.foods.find(x=>x.id===id);if(!f)return;modal(`<div class="modalhead"><div><h2>${esc(f.name)}</h2><div class="muted">${esc(f.type||'Aliment')}${f.brand?' · '+esc(f.brand):''}</div></div><button class="close" data-close>×</button></div><div class="metricgrid"><div class="metric"><div class="k">Énergie</div><div class="v" style="font-size:19px">${esc(foodEnergyLabel(f))}</div></div><div class="metric"><div class="k">Portion habituelle</div><div class="v" style="font-size:19px">${esc(f.usualPortion||'—')}</div></div></div><div class="sectiontitle">Constituants analytiques</div><div class="nutrigrid">${nutrient('Humidité',f.humidity)}${nutrient('Protéines',f.protein)}${nutrient('Matières grasses',f.fat)}${nutrient('Cellulose / fibres',f.fiber)}${nutrient('Cendres',f.ash)}${nutrient('Calcium',f.calcium)}${nutrient('Phosphore',f.phosphorus)}${nutrient('Oméga 3',f.omega3)}${nutrient('Oméga 6',f.omega6)}${nutrient('ENA / glucides',f.ena)}${nutrient('Taurine',f.taurine,'')}</div>${f.notes?`<div class="sectiontitle">Notes</div><div class="note">${esc(f.notes)}</div>`:''}<div class="seg" style="margin-top:16px"><button class="btn" id="editFood">Modifier</button><button class="btn danger" id="deleteFood">Supprimer</button></div>`);document.getElementById('editFood').onclick=()=>foodModal(f.id);document.getElementById('deleteFood').onclick=()=>{if(confirm('Supprimer cet aliment ?')){state.foods=state.foods.filter(x=>x.id!==f.id);delete todayFood[f.id];save();closeModal();renderKcal()}}}
function foodModal(editId=''){const current=editId?state.foods.find(x=>x.id===editId):null;const v=(k,d='')=>current?.[k]??d;modal(`<div class="modalhead"><h2>${current?'Modifier':'Ajouter'} un aliment</h2><button class="close" data-close>×</button></div><div class="field"><label>Nom</label><input id="fname" value="${esc(v('name'))}"></div><div class="seg"><div class="field"><label>Marque</label><input id="fbrand" value="${esc(v('brand'))}"></div><div class="field"><label>Type</label><select id="ftype"><option>Croquettes</option><option>Pâtée</option><option>Mousse</option><option>Soupe</option><option>Friandise</option><option>Autre</option></select></div></div><div class="field"><label>Calcul des calories</label><select id="fmode"><option value="g">kcal par gramme</option><option value="portion">kcal par portion</option></select></div><div class="seg"><div class="field"><label>Valeur énergétique</label><input id="fkcal" type="number" step="0.01" inputmode="decimal" value="${esc(String(v('kcal')))}"></div><div class="field"><label>Poids portion (g)</label><input id="fportion" type="number" step="0.1" inputmode="decimal" value="${esc(String(v('portionWeight')))}"></div></div><div class="field"><label>Portion habituelle</label><input id="fusual" placeholder="Ex. 25 g, 1 sachet" value="${esc(v('usualPortion'))}"></div><div class="sectiontitle">Constituants analytiques (%)</div><div class="seg"><div class="field"><label>Humidité</label><input id="fhumidity" type="number" step="0.01" value="${esc(String(v('humidity')))}"></div><div class="field"><label>Protéines</label><input id="fprotein" type="number" step="0.01" value="${esc(String(v('protein')))}"></div></div><div class="seg"><div class="field"><label>Matières grasses</label><input id="ffat" type="number" step="0.01" value="${esc(String(v('fat')))}"></div><div class="field"><label>Fibres / cellulose</label><input id="ffiber" type="number" step="0.01" value="${esc(String(v('fiber')))}"></div></div><div class="seg"><div class="field"><label>Cendres</label><input id="fash" type="number" step="0.01" value="${esc(String(v('ash')))}"></div><div class="field"><label>Calcium</label><input id="fcalcium" type="number" step="0.01" value="${esc(String(v('calcium')))}"></div></div><div class="seg"><div class="field"><label>Phosphore</label><input id="fphosphorus" type="number" step="0.01" value="${esc(String(v('phosphorus')))}"></div><div class="field"><label>ENA / glucides</label><input id="fena" type="number" step="0.01" value="${esc(String(v('ena')))}"></div></div><div class="seg"><div class="field"><label>Oméga 3</label><input id="fomega3" type="number" step="0.01" value="${esc(String(v('omega3')))}"></div><div class="field"><label>Oméga 6</label><input id="fomega6" type="number" step="0.01" value="${esc(String(v('omega6')))}"></div></div><div class="field"><label>Taurine</label><input id="ftaurine" placeholder="Ex. 3200 mg/kg" value="${esc(v('taurine'))}"></div><div class="field"><label>Notes</label><textarea id="fnotes">${esc(v('notes'))}</textarea></div><button class="btn primary full" id="fsave">${current?'Enregistrer':'Ajouter'}</button>`);ftype.value=v('type','Autre');fmode.value=v('mode','g');const num=id=>{const x=document.getElementById(id).value;return x===''?null:+x};document.getElementById('fsave').onclick=()=>{if(!fname.value.trim()||!(+fkcal.value))return alert('Nom et calories requis.');const id=current?.id||crypto.randomUUID();const food={id,name:fname.value.trim(),brand:fbrand.value.trim(),type:ftype.value,mode:fmode.value,kcal:+fkcal.value,portionWeight:num('fportion'),defaultQty:current?.defaultQty||0,usualPortion:fusual.value.trim(),humidity:num('fhumidity'),protein:num('fprotein'),fat:num('ffat'),fiber:num('ffiber'),ash:num('fash'),calcium:num('fcalcium'),phosphorus:num('fphosphorus'),omega3:num('fomega3'),omega6:num('fomega6'),ena:num('fena'),taurine:ftaurine.value.trim(),notes:fnotes.value.trim()};if(current){Object.assign(current,food)}else{state.foods.push(food);todayFood[id]=0}save();closeModal();renderKcal()}}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal">${html}</div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('.modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
document.getElementById('appearanceBtn').onclick=()=>{const def=state.profile.defaultAccent||'#2563eb';modal(`<div class="modalhead"><h2>Apparence — ${esc(state.profile.nickname)}</h2><button class="close" data-close>×</button></div><div class="appearance-grid"><button class="btn ${state.settings.theme==='light'?'primary':''}" data-themebtn="light">☀️ Clair</button><button class="btn ${state.settings.theme==='dark'?'primary':''}" data-themebtn="dark">🌙 Sombre</button></div><div class="sectiontitle">Couleur</div><div class="appearance-grid"><button class="btn" id="defaultColor">Couleur par défaut</button><input class="colorpick" id="accentPicker" type="color" value="${state.settings.accent}"></div><div class="sectiontitle">Sauvegarde Cats</div><div class="seg"><button class="btn" id="exportJson">Exporter JSON</button><button class="btn" id="importJson">Importer JSON</button></div><input id="jsonFile" type="file" accept="application/json" class="hidden"><div class="note" style="margin-top:12px">La sauvegarde Cats contient les données des deux chats et leurs réglages. Les PDF préchargés de Spike restent intégrés à l’application.</div>`);document.querySelectorAll('[data-themebtn]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.themebtn;save();applyTheme();closeModal();render()});defaultColor.onclick=()=>{state.settings.accent=def;save();applyTheme();closeModal();render()};accentPicker.oninput=()=>{state.settings.accent=accentPicker.value;save();applyTheme()};exportJson.onclick=()=>{const blob=new Blob([JSON.stringify(rootState,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Cats_sauvegarde_'+isoToday()+'.json';a.click();URL.revokeObjectURL(a.href)};importJson.onclick=()=>jsonFile.click();jsonFile.onchange=async()=>{try{const incoming=JSON.parse(await jsonFile.files[0].text());if(incoming?.cats){rootState=incoming;rootState.cats.alpha=merge(clone(alphaDefaults),rootState.cats.alpha||{});rootState.cats.bebew=merge(makeBebewDefaults(),rootState.cats.bebew||{});if(!rootState.selected||!rootState.cats[rootState.selected])rootState.selected='alpha';state=rootState.cats[rootState.selected]}else{state=merge(state,incoming);rootState.cats[rootState.selected]=state}kcalTarget=state.energyTargets?.low||state.energyTargets?.maint||0;todayFood={};save();applyTheme();closeModal();render()}catch(e){alert('Sauvegarde JSON invalide.')}}}
document.getElementById('catSwitchBtn').onclick=()=>showProfilePicker(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
updateCatButton();render();if(!rootState.welcomed)setTimeout(()=>showProfilePicker(true),50);
</script>
</body>
</html>
