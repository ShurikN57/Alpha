ar(--panel2);border-radius:16px;display:block}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted)}.foodrow{display:grid;grid-template-columns:1fr 90px 58px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.foodrow:first-child{border-top:0}.progress{height:16px;background:var(--panel2);border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:.2s}.kcalbig{text-align:center;font-weight:900;font-size:44px}.targetswitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.targetswitch button.active{background:var(--accent);color:#fff}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end}.modal{background:var(--panel);width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modalhead h2{margin:0}.close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px}.appearance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colorpick{width:100%;height:48px;padding:4px}.note{font-size:13px;line-height:1.45;color:var(--muted)}

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const s=JSON.parse(localStorage.getItem(K));return s?merge(clone(defaults),s):clone(defaults)}catch(e){return clone(defaults)}}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])a[k]=merge(a[k],b[k]);else a[k]=b[k]}return a}
let state=load(); let view='calendar'; let calCursor=new Date(); let kcalTarget=190; let todayFood={};
function save(){localStorage.setItem(K,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function isoToday(){return new Date().toISOString().slice(0,10)}
function applyTheme(){document.documentElement.dataset.theme=state.settings.theme;document.documentElement.style.setProperty('--accent',state.settings.accent);document.querySelector('meta[name=theme-color]').content=state.settings.accent}
applyTheme();
const titles={calendar:'📅 Calendrier',cr:'📄 Comptes rendus',weight:'⚖️ Poids',fr:'🫁 Fréquence respiratoire',kcal:'🍽️ Calories'};
function switchView(v){view=v;document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById('view-'+v).classList.remove('hidden');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('pageTitle').textContent=titles[v];render()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function render(){({calendar:renderCalendar,cr:renderCR,weight:renderWeight,fr:renderFR,kcal:renderKcal}[view])()}
function renderCalendar(){const el=document.getElementById('view-calendar');const y=calCursor.getFullYear(),m=calCursor.getMonth();const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()+1);let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10),inM=d.getMonth()===m,has=state.appointments.some(a=>a.date===iso);cells+=`<div class="day ${inM?'':'out'} ${iso===isoToday()?'today':''} ${has?'has':''}" data-day="${iso}">${d.getDate()}</div>`}const now=isoToday(),past=state.appointments.filter(a=>a.date<now).sort((a,b)=>b.date.localeCompare(a.date))[0],future=state.appointments.filter(a=>a.date>=now).sort((a,b)=>a.date.localeCompare(b.date))[0];const monthAppts=state.appointments.filter(a=>{const d=new Date(a.date+'T12:00:00');return d.getMonth()===m&&d.getFullYear()===y}).sort((a,b)=>a.date.localeCompare(b.date));el.innerHTML=`<div class="card"><div class="cardpad"><div class="seg"><button class="btn" id="lastBtn">Dernier RDV</button><button class="btn primary" id="nextBtn">Prochain RDV</button></div></div></div>
<div class="card"><div class="cardpad"><div class="calendar-head"><button class="btn" id="prevM">←</button><div class="monthtitle">${new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div><button class="btn" id="nextM">→</button></div><div class="weekdays"><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div><div class="days">${cells}</div><button class="btn primary full" id="addAppt" style="margin-top:12px">+ Ajouter un RDV</button></div></div>
<div class="card"><div class="cardpad"><h2>Rendez-vous du mois</h2>${monthAppts.length?monthAppts.map(a=>`<div class="appt" id="appt-${a.id}"><strong>${fmtDate(a.date)}${a.time?' · '+esc(a.time):''} — ${esc(a.title)}</strong><span class="muted">${esc(a.place||'')}</span>${a.notes?`<div class="note">${esc(a.notes)}</div>`:''}<div class="row" style="margin-top:9px"><button class="btn" data-editappt="${a.id}">Modifier</button><button class="btn danger" data-delappt="${a.id}">Supprimer</button></div></div>`).join(''):'<div class="muted">Aucun rendez-vous ce mois.</div>'}</div></div>`;
el.querySelector('#prevM').onclick=()=>{calCursor=new Date(y,m-1,1);renderCalendar()};el.querySelector('#nextM').onclick=()=>{calCursor=new Date(y,m+1,1);renderCalendar()};el.querySelector('#addAppt').onclick=()=>apptModal();el.querySelector('#lastBtn').onclick=()=>jumpAppt(past);el.querySelector('#nextBtn').onclick=()=>jumpAppt(future);el.querySelectorAll('[data-day]').forEach(d=>d.onclick=()=>apptModal(null,d.dataset.day));el.querySelectorAll('[data-editappt]').forEach(b=>b.onclick=()=>apptModal(state.appointments.find(a=>a.id===b.dataset.editappt)));el.querySelectorAll('[data-delappt]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer ce rendez-vous ?')){state.appointments=state.appointments.filter(a=>a.id!==b.dataset.delappt);save();renderCalendar()}})}
function jumpAppt(a){if(!a){alert('Aucun rendez-vous correspondant.');return}const d=new Date(a.date+'T12:00:00');calCursor=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();setTimeout(()=>document.getElementById('appt-'+a.id)?.scrollIntoView({behavior:'smooth',block:'center'}),30)}
function apptModal(a,datePref){modal(`<div class="modalhead"><h2>${a?'Modifier':'Ajouter'} un RDV</h2><button class="close" data-close>×</button></div><div class="field"><label>Date</label><input id="adate" type="date" value="${a?.date||datePref||isoToday()}"></div><div class="field"><label>Heure</label><input id="atime" type="time" value="${a?.time||''}"></div><div class="field"><label>Type / titre</label><input id="atitle" value="${esc(a?.title||'Contrôle vétérinaire')}"></div><div class="field"><label>Lieu</label><input id="aplace" value="${esc(a?.place||'')}"></div><div class="field"><label>Notes</label><textarea id="anotes">${esc(a?.notes||'')}</textarea></div><button class="btn primary full" id="saveAppt">Enregistrer</button>`);document.getElementById('saveAppt').onclick=()=>{const obj={id:a?.id||crypto.randomUUID(),date:adate.value,time:atime.value,title:atitle.value.trim(),place:aplace.value.trim(),notes:anotes.value.trim()};if(!obj.date||!obj.title)return alert('Date et titre requis.');if(a)state.appointments=state.appointments.map(x=>x.id===a.id?obj:x);else state.appointments.push(obj);save();closeModal();renderCalendar()}}
function renderCR(){const el=document.getElementById('view-cr');el.innerHTML=`<div class="card"><div class="cardpad"><h2>Spike « Alpha »</h2><div class="muted">Historique des comptes rendus et mesures échographiques.</div></div>${state.cr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="crcard"><div class="crdate">${fmtDate(c.date)}</div><strong>${esc(c.title)}</strong><div class="crsummary">${esc(c.summary)}</div><div class="row wraprow">${c.files.map(f=>`<button class="btn" data-pdf="${esc(f[1])}">📄 ${esc(f[0])}</button>`).join('')}</div></div>`).join('')}</div><div class="card"><div class="cardpad"><h2>Ajouter un document</h2><div class="note">La V1 conserve les CR fournis dans l’application. Un ajout manuel peut enregistrer un lien/fichier choisi localement pour la session, mais les fichiers ajoutés par l’iPhone ne peuvent pas être intégrés durablement au ZIP sans stockage cloud. Pour la V1, utilise les documents préchargés.</div></div></div>`;el.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>window.open(b.dataset.pdf,'_blank'))}
function chart(canvas,data,colorKey='value'){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(data.length<1)return;const vals=data.map(x=>x[colorKey]),min=Math.min(...vals),max=Math.max(...vals),pad=28,span=(max-min)||1;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.lineWidth=1;for(let i=0;i<4;i++){let y=pad+(h-pad*2)*i/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}ctx.strokeStyle=state.settings.accent;ctx.fillStyle=state.settings.accent;ctx.lineWidth=3;ctx.beginPath();data.forEach((x,i)=>{let xx=pad+(w-pad*2)*(data.length===1?.5:i/(data.length-1)),yy=h-pad-(x[colorKey]-min)/span*(h-pad*2);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();data.forEach((x,i)=>{let xx=pad+(w-pad*2)*(data.length===1?.5:i/(data.length-1)),yy=h-pad-(x[colorKey]-min)/span*(h-pad*2);ctx.beginPath();ctx.arc(xx,yy,4,0,Math.PI*2);ctx.fill()})}
function renderWeight(){const el=document.getElementById('view-weight'),arr=state.weight.slice().sort((a,b)=>a.date.localeCompare(b.date)),last=arr.at(-1),prev=arr.at(-2),delta=last&&prev?last.value-prev.value:0,first=arr[0];el.innerHTML=`<div class="card"><div class="cardpad"><div class="metricgrid"><div class="metric"><div class="k">Dernier poids</div><div class="v">${last?last.value.toFixed(2)+' kg':'—'}</div></div><div class="metric"><div class="k">Depuis la mesure précédente</div><div class="v">${last&&prev?(delta>=0?'+':'')+delta.toFixed(2)+' kg':'—'}</div></div><div class="metric"><div class="k">Depuis le début</div><div class="v">${last&&first?((last.value-first.value)>=0?'+':'')+(last.value-first.value).toFixed(2)+' kg':'—'}</div></div><div class="metric"><div class="k">Mesures</div><div class="v">${arr.length}</div></div></div><button class="btn primary full" id="addWeight" style="margin-top:12px">+ Ajouter un poids</button></div></div><div class="card"><div class="cardpad"><h2>Évolution</h2><canvas id="weightChart" class="graph"></canvas></div></div><div class="card"><div class="cardpad"><h2>Historique</h2><table class="table"><thead><tr><th>Date</th><th>Poids</th><th></th></tr></thead><tbody>${arr.slice().reverse().map((x,i)=>`<tr><td>${fmtDate(x.date)}</td><td><strong>${x.value.toFixed(2)} kg</strong></td><td><button class="btn danger" data-wdel="${x.date}|${x.value}">×</button></td></tr>`).join('')}</tbody></table></div></div>`;requestAnimationFrame(()=>chart(document.getElementById('weightChart'),arr));el.querySelector('#addWeight').onclick=()=>measureModal('weight');el.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{const [d,v]=b.dataset.wdel.split('|');if(confirm('Supprimer cette mesure ?')){const idx=state.weight.findIndex(x=>x.date===d&&String(x.value)===v);if(idx>=0)state.weight.splice(idx,1);save();renderWeight()}})}
function renderFR(){const el=document.getElementById('view-fr'),arr=state.fr.slice().sort((a,b)=>a.date.localeCompare(b.date)),plot=arr.map(x=>({...x,mid:(x.min+x.max)/2})),last=arr.at(-1);el.innerHTML=`<div class="card"><div class="cardpad"><div class="metricgrid"><div class="metric"><div class="k">Dernière FR</div><div class="v">${last?(last.min===last.max?last.min:last.min+'–'+last.max)+'/min':'—'}</div></div><div class="metric"><div class="k">Contexte</div><div class="v" style="font-size:17px">${last?esc(last.context):'—'}</div></div></div><button class="btn primary full" id="addFR" style="margin-top:12px">+ Ajouter une FR</button></div></div><div class="card"><div class="cardpad"><h2>Évolution</h2><canvas id="frChart" class="graph"></canvas><div class="note" style="margin-top:8px">Le graphique utilise la moyenne lorsqu’une mesure est saisie sous forme de fourchette.</div></div></div><div class="card"><div class="cardpad"><h2>Historique</h2>${arr.slice().reverse().map(x=>`<div class="listitem"><div class="grow"><strong>${fmtDate(x.date)} · ${x.min===x.max?x.min:x.min+'–'+x.max}/min</strong><div class="muted">${esc(x.context)}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div><button class="btn danger" data-frdel="${x.date}|${x.min}|${x.max}|${esc(x.context)}">×</button></div>`).join('')}</div></div>`;requestAnimationFrame(()=>chart(document.getElementById('frChart'),plot,'mid'));el.querySelector('#addFR').onclick=()=>measureModal('fr');el.querySelectorAll('[data-frdel]').forEach(b=>b.onclick=()=>{const [d,mi,ma,c]=b.dataset.frdel.split('|');if(confirm('Supprimer cette mesure ?')){const idx=state.fr.findIndex(x=>x.date===d&&x.min==mi&&x.max==ma&&x.context===c);if(idx>=0)state.fr.splice(idx,1);save();renderFR()}})}
function measureModal(type){const fr=type==='fr';modal(`<div class="modalhead"><h2>${fr?'Ajouter une FR':'Ajouter un poids'}</h2><button class="close" data-close>×</button></div><div class="field"><label>Date</label><input id="mdate" type="date" value="${isoToday()}"></div>${fr?`<div class="seg"><div class="field"><label>Minimum /min</label><input id="mmin" type="number" inputmode="decimal" value="20"></div><div class="field"><label>Maximum /min</label><input id="mmax" type="number" inputmode="decimal" value="20"></div></div><div class="field"><label>Contexte</label><input id="mctx" placeholder="Au repos, sommeil profond…"></div><div class="field"><label>Note</label><input id="mnote" placeholder="Température, durée de sommeil…"></div>`:`<div class="field"><label>Poids (kg)</label><input id="mvalue" type="number" step="0.01" inputmode="decimal" placeholder="5,80"></div>`}<button class="btn primary full" id="msave">Enregistrer</button>`);document.getElementById('msave').onclick=()=>{if(fr){const mi=+mmin.value,ma=+mmax.value;if(!mdate.value||!mi||!ma)return alert('Valeurs requises.');state.fr.push({date:mdate.value,min:Math.min(mi,ma),max:Math.max(mi,ma),context:mctx.value.trim()||'Non précisé',note:mnote.value.trim()})}else{const v=+mvalue.value;if(!mdate.value||!v)return alert('Date et poids requis.');state.weight.push({date:mdate.value,value:v})}save();closeModal();render()}}
function renderKcal(){const el=document.getElementById('view-kcal');state.foods.forEach(f=>{if(todayFood[f.id]===undefined)todayFood[f.id]=f.id==='f1'?25:(f.id==='f2'||f.id==='f4'?1:0)});const total=calcKcal(),left=kcalTarget-total;el.innerHTML=`<div class="card"><div class="cardpad"><div class="targetswitch"><button class="btn ${kcalTarget===190?'active':''}" data-target="190">Sèche · 190 kcal</button><button class="btn ${kcalTarget===210?'active':''}" data-target="210">Maintien · 210 kcal</button></div><div class="kcalbig">${Math.round(total)} <span style="font-size:18px">kcal</span></div><div class="progress"><div style="width:${Math.min(100,total/kcalTarget*100)}%"></div></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Objectif ${kcalTarget}</span><strong>${left>=0?Math.round(left)+' kcal restantes':Math.abs(Math.round(left))+' kcal au-dessus'}</strong></div></div></div><div class="card"><div class="cardpad"><h2>Repas du jour</h2>${state.foods.map(f=>`<div class="foodrow"><div><strong>${esc(f.name)}</strong><div class="muted">${f.mode==='g'?f.kcal.toFixed(2)+' kcal/g':f.kcal+' kcal/portion'}</div></div><input data-food="${f.id}" type="number" min="0" step="${f.mode==='g'?'1':'0.5'}" value="${todayFood[f.id]}"><div style="text-align:right;font-weight:800">${Math.round((todayFood[f.id]||0)*f.kcal)}</div></div>`).join('')}<div class="seg" style="margin-top:12px"><button class="btn" id="addFood">+ Aliment</button><button class="btn primary" id="saveDay">Enregistrer le jour</button></div></div></div><div class="card"><div class="cardpad"><h2>Repère habituel</h2><div class="note">25 g de croquettes + 1 Félix Soupe + 1 sachet Félix effilés = <strong>169 kcal</strong>.</div></div></div><div class="card"><div class="cardpad"><h2>Historique calories</h2>${state.kcalHistory.length?state.kcalHistory.slice().reverse().map(x=>`<div class="listitem"><div class="grow"><strong>${fmtDate(x.date)} · ${Math.round(x.total)} kcal</strong><div class="muted">Objectif ${x.target} kcal</div></div><button class="btn danger" data-kdel="${x.id}">×</button></div>`).join(''):'<div class="muted">Aucune journée enregistrée.</div>'}</div></div>`;el.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{kcalTarget=+b.dataset.target;renderKcal()});el.querySelectorAll('[data-food]').forEach(inp=>inp.oninput=()=>{todayFood[inp.dataset.food]=+inp.value||0;renderKcal()});el.querySelector('#addFood').onclick=foodModal;el.querySelector('#saveDay').onclick=()=>{const d=isoToday(),entry={id:crypto.randomUUID(),date:d,target:kcalTarget,total:calcKcal(),items:clone(todayFood)};state.kcalHistory=state.kcalHistory.filter(x=>x.date!==d);state.kcalHistory.push(entry);save();alert('Journée enregistrée.');renderKcal()};el.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette journée ?')){state.kcalHistory=state.kcalHistory.filter(x=>x.id!==b.dataset.kdel);save();renderKcal()}})}
function calcKcal(){return state.foods.reduce((s,f)=>s+(todayFood[f.id]||0)*f.kcal,0)}
function foodModal(){modal(`<div class="modalhead"><h2>Ajouter un aliment</h2><button class="close" data-close>×</button></div><div class="field"><label>Nom</label><input id="fname"></div><div class="field"><label>Calcul</label><select id="fmode"><option value="g">kcal par gramme</option><option value="portion">kcal par portion</option></select></div><div class="field"><label>Valeur énergétique</label><input id="fkcal" type="number" step="0.01" inputmode="decimal"></div><button class="btn primary full" id="fsave">Ajouter</button>`);fsave.onclick=()=>{if(!fname.value.trim()||!(+fkcal.value))return alert('Nom et calories requis.');const id=crypto.randomUUID();state.foods.push({id,name:fname.value.trim(),mode:fmode.value,kcal:+fkcal.value,defaultQty:0});todayFood[id]=0;save();closeModal();renderKcal()}}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal">${html}</div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('.modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
document.getElementById('appearanceBtn').onclick=()=>{modal(`<div class="modalhead"><h2>Apparence</h2><button class="close" data-close>×</button></div><div class="appearance-grid"><button class="btn ${state.settings.theme==='light'?'primary':''}" data-themebtn="light">☀️ Clair</button><button class="btn ${state.settings.theme==='dark'?'primary':''}" data-themebtn="dark">🌙 Sombre</button></div><div class="sectiontitle">Couleur</div><div class="appearance-grid"><button class="btn" id="defaultColor">Défaut bleu</button><input class="colorpick" id="accentPicker" type="color" value="${state.settings.accent}"></div><div class="sectiontitle">Sauvegarde</div><div class="seg"><button class="btn" id="exportJson">Exporter JSON</button><button class="btn" id="importJson">Importer JSON</button></div><input id="jsonFile" type="file" accept="application/json" class="hidden"><div class="note" style="margin-top:12px">Le JSON sauvegarde rendez-vous, poids, FR, aliments, calories et réglages. Les PDF fournis restent intégrés à l’application.</div>`);document.querySelectorAll('[data-themebtn]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.themebtn;save();applyTheme();closeModal();render()});defaultColor.onclick=()=>{state.settings.accent='#2563eb';save();applyTheme();closeModal();render()};accentPicker.oninput=()=>{state.settings.accent=accentPicker.value;save();applyTheme()};exportJson.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Alpha_sauvegarde_'+isoToday()+'.json';a.click();URL.revokeObjectURL(a.href)};importJson.onclick=()=>jsonFile.click();jsonFile.onchange=async()=>{try{state=merge(clone(defaults),JSON.parse(await jsonFile.files[0].text()));save();applyTheme();closeModal();render()}catch(e){alert('Sauvegarde JSON invalide.')}}}
function net(){document.getElementById('netdot').style.background=navigator.onLine?'#70d79d':'#df4d4d'};window.addEventListener('online',net);window.addEventListener('offline',net);net();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
