<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cats">
<link rel="manifest" href="manifest.webmanifest?v=1.5.1">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cats</title>
<script>window.__build='';try{window.__build=localStorage.getItem('cats_build')||''}catch(e){}document.write('<link rel="stylesheet" href="app.css?b='+window.__build+'">')</script>
</head>
<body>
<header class="topbar"><button class="catbtn" id="catSwitchBtn" aria-label="Changer de chat"><img class="catmini" id="catAvatarImg" src="avatar-alpha.png" alt=""><span id="catSwitchLabel">Alpha</span> ▾</button><div class="title" id="pageTitle">📅 Calendrier</div><button class="iconbtn" id="appearanceBtn">◉</button></header>
<main class="wrap">
<section id="view-calendar"></section>
<section id="view-cr" class="hidden"></section>
<section id="view-weight" class="hidden"></section>
<section id="view-fr" class="hidden"></section>
<section id="view-kcal" class="hidden"></section>
</main>
<nav class="bottomnav">
<button class="navbtn active" data-view="calendar"><span class="ico">📅</span><span></span></button>
<button class="navbtn" data-view="cr" aria-label="Comptes rendus"><span class="ico">📄</span><span></span></button>
<button class="navbtn" data-view="weight" aria-label="Poids"><span class="ico">⚖️</span><span></span></button>
<button class="navbtn" data-view="fr" aria-label="Fr. Respiratoire"><span class="ico">🫁</span><span></span></button>
<button class="navbtn" data-view="kcal"><span class="ico">🍽️</span><span></span></button>
</nav>
<div id="modalRoot"></div>
<script src="lib/pdfjs/pdf.min.js"></script>
<script>document.write('<script src="scan.js?b='+window.__build+'"><\/script><script src="app.js?b='+window.__build+'"><\/script>')</script>
</body>
</html>
